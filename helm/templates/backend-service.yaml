apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    {{- if .Values.app.metrics.enabled }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.app.metrics.port }}
      targetPort: metrics
    {{- end }}
  type: {{ .Values.app.service.type }}
